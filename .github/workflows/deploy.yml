# Build the Astro site and publish it to GitHub Pages on every push to main.
# Setup (once): repo Settings -> Pages -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows running the workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this workflow to read the repo and create a Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push cancels a queued older one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Install, build and upload the site
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
